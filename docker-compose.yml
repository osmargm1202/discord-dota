services:
  dota-discord-bot:
    image: orgmcr.or-gm.com/osmargm1202/dota-discord-bot:latest
    container_name: dota-discord-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      discord-dota-postgres:
        condition: service_healthy
      discord-dota-minio:
        condition: service_healthy
    networks:
      - dota-bot-network
      - cloudflared

  discord-dota-postgres:
    image: postgres:16-alpine
    container_name: discord-dota-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dotabot}
      POSTGRES_USER: ${POSTGRES_USER:-dotabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dotabot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dota-bot-network

  discord-dota-minio:
    image: minio/minio
    container_name: discord-dota-minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dota-bot-network
      - cloudflared

networks:
  cloudflared:
    external: true
  dota-bot-network:
    driver: bridge
